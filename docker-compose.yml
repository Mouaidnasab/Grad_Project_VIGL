
services:
  fastapi:
    build:
      context: ./supermarket_backend
      dockerfile: Dockerfile
    image: mouaidnasab/fastapi_service:1.0.0
    container_name: fastapi_service
    ports:
      - "4235:8000"
    volumes:
      - ./supermarket_backend:/app
    environment:
      - APP_ENV=production

  react:
    build:
      context: ./supermarket_web_frontend/Initialization frontend
      dockerfile: Dockerfile
    image: mouaidnasab/react_service:1.0.0
    container_name: react_service
    ports:
      - "4326:3000"
    volumes:
      - ./supermarket_web_frontend/Initialization frontend:/app
    environment:
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true