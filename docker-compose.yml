services:
  gov-backend:
    container_name: Gov-Backend
    build:
      context: ./gov_backend
      dockerfile: Dockerfile
    ports:
      - "3603:8000"
    restart: always
    volumes:
      - ./gov_backend:/app:ro

  gov-frontend:
    container_name: Gov-Frontend
    build:
      context: ./gov_frontend_web
      dockerfile: Dockerfile
    ports:
      - "3604:3000"
    restart: always


