  #     environment:
  #       - DOTENV_PATH=/app/.env
  supermarket-frontend:
    container_name: Supermarket-Frontend
    build:
      context: ./supermarket_frontend_web
      dockerfile: Dockerfile
    ports:
      - "3602:3000"
    restart: always


  customer-frontend:
    container_name: Customer-Frontend
    build:
      context: ./customer_frontend_mobile
      dockerfile: Dockerfile
    ports:
      - "3605:3000"
    restart: always

